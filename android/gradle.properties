# Heap sized to fit alongside a browser + the model download running on this
# machine. The original -Xmx8G could not be satisfied when free RAM dropped to
# ~5 GB, and a Gradle worker was OOM-killed ("a build operation failed") even
# though each task compiled fine in isolation. 4 GB builds reliably here.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
